name: Build SM6350 Kernel with SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Base defconfig to use'
        required: false
        default: 'vendor/lito-perf_defconfig'
      device_config:
        description: 'Device-specific config fragment'
        required: false
        default: 'vendor/billie.config'
      sukisu_tag:
        description: 'SukiSU-Ultra version tag to install'
        required: false
        default: 'v3.2.0'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libssl-dev python3 \
            libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git curl zip unzip libelf-dev libncurses5-dev liblz4-tool \
            make binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler rsync cpio kmod openssl pkg-config \
            lld llvm clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/danascape/linux-oneplus-sm6350.git kernel_sm6350
          cd kernel_sm6350
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Download ProtonClang (Clang 17 for Kernel Building)
        run: |
          mkdir -p clang-prebuilt
          cd clang-prebuilt
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-17
          echo "---- ตรวจสอบ Clang binary ----"
          ./clang-17/bin/clang --version
          echo "CLANG_DIR=$(pwd)/clang-17" >> $GITHUB_ENV

      - name: Install SukiSU-Ultra
        working-directory: kernel_sm6350
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s ${{ github.event.inputs.sukisu_tag }}
          echo "---- ตรวจสอบว่า SukiSU-Ultra ถูกฝังแล้ว ----"
          ls -la KernelSU/ 2>/dev/null || ls -la SukiSU/ 2>/dev/null || true

      - name: Merge defconfig + device config fragment
        working-directory: kernel_sm6350
        run: |
          mkdir -p out
          export ARCH=arm64
          scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/${{ github.event.inputs.defconfig }} \
            arch/arm64/configs/${{ github.event.inputs.device_config }}
          ls -la out/.config

      - name: Enable SukiSU-Ultra required configs (non-GKI)
        working-directory: kernel_sm6350
        run: |
          export ARCH=arm64
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_KALLSYMS=y" >> out/.config
          echo "CONFIG_KALLSYMS_ALL=y" >> out/.config
          echo "CONFIG_KPM=y" >> out/.config
          echo "CONFIG_HAVE_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          PATH=$GITHUB_WORKSPACE/clang-prebuilt/clang-17/bin:$PATH \
          make -C $(pwd) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Build kernel
        working-directory: kernel_sm6350
        run: |
          export PATH=$GITHUB_WORKSPACE/clang-prebuilt/clang-17/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Collect build log always (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_sm6350/build.log
          retention-days: 14

      - name: Locate build output
        if: success()
        working-directory: kernel_sm6350
        run: |
          find out/arch/arm64/boot -maxdepth 2 -type f \( -name "Image*" -o -name "dtb*" -o -name "*.dtb" \)
          mkdir -p artifact_out
          cp out/arch/arm64/boot/Image* artifact_out/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtb* artifact_out/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} artifact_out/ \; 2>/dev/null || true
          ls -la artifact_out/

      - name: Upload kernel image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output-sm6350
          path: kernel_sm6350/artifact_out/
          retention-days: 14
