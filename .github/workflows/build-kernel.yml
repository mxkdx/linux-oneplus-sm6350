name: Build SM6350 Kernel with KernelSU

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Base defconfig to use'
        required: false
        default: 'vendor/lito-perf_defconfig'
      device_config:
        description: 'Device-specific config fragment'
        required: false
        default: 'vendor/billie.config'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libssl-dev python3 \
            libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git curl zip unzip libelf-dev libncurses5-dev liblz4-tool \
            make binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            device-tree-compiler rsync cpio kmod openssl pkg-config \
            lld llvm clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/danascape/linux-oneplus-sm6350.git kernel_sm6350
          cd kernel_sm6350
          echo "KERNEL_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Download Clang prebuilt toolchain (clang-r498229 / 17.x)
        run: |
          mkdir -p clang-prebuilt
          cd clang-prebuilt
          git init -q
          git remote add origin https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/
          git config core.sparseCheckout true
          echo "clang-r498229/*" >> .git/info/sparse-checkout
          git pull --depth=1 origin main
          ls clang-r498229/bin/ | head -20
          ./clang-r498229/bin/clang --version
          echo "CLANG_DIR=$(pwd)/clang-r498229" >> $GITHUB_ENV

      - name: Install KernelSU v0.9.5
        working-directory: kernel_sm6350
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          echo "---- ตรวจสอบว่า KernelSU ถูกฝังแล้ว ----"
          ls -la KernelSU/ || true
          grep -r "KernelSU" Makefile || true

      - name: Merge defconfig + device config fragment
        working-directory: kernel_sm6350
        run: |
          mkdir -p out
          export ARCH=arm64
          scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/${{ github.event.inputs.defconfig }} \
            arch/arm64/configs/${{ github.event.inputs.device_config }}
          ls -la out/.config
          echo "---- ตรวจสอบค่า config สำคัญ ----"
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_FG_BQ27541|CONFIG_AW8697_HAPTIC|CONFIG_TOUCHPANEL_FOCAL_FT3518|CONFIG_ONEPLUS_FASTCHG" out/.config || true

      - name: Enable KernelSU config explicitly
        working-directory: kernel_sm6350
        run: |
          export ARCH=arm64
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          PATH=$GITHUB_WORKSPACE/clang-prebuilt/clang-r498229/bin:$PATH \
          make -C $(pwd) O=out ARCH=arm64 \
            CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Build kernel
        working-directory: kernel_sm6350
        run: |
          export PATH=$GITHUB_WORKSPACE/clang-prebuilt/clang-r498229/bin:$PATH
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            2>&1 | tee build.log

      - name: Collect build log always (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_sm6350/build.log
          retention-days: 14

      - name: Locate build output
        if: success()
        working-directory: kernel_sm6350
        run: |
          find out/arch/arm64/boot -maxdepth 2 -type f \( -name "Image*" -o -name "dtb*" -o -name "*.dtb" \)
          mkdir -p artifact_out
          cp out/arch/arm64/boot/Image* artifact_out/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtb* artifact_out/ 2>/dev/null || true
          find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} artifact_out/ \; 2>/dev/null || true
          ls -la artifact_out/

      - name: Upload kernel image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output-sm6350
          path: kernel_sm6350/artifact_out/
          retention-days: 14
